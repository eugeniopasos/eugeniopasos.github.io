remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark" # or "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale: "en-US"
title: "Eugenio Pasos - Robotics and Electrical Engineer"
masthead_title: "Eugenio Pasos - Robotics and Electrical Engineer"
title_separator: "|"
name: "Eugenio Pasos"
description: "Portfolio of Eugenio Pasos — Robotics and Electrical Engineer specializing in autonomous systems, ROS 2, computer vision, and embedded firmware."
url: "https://eugeniopasos.github.io"
baseurl: ""
repository: "eugeniopasos/eugeniopasos.github.io"

# Plugins
plugins:
  - jekyll-include-cache

# Page Options
breadcrumbs: true
words_per_minute: 200

# Author Profile (Sidebar)
author:
  name: "Eugenio Pasos"
  avatar: "/assets/images/avatar.png"
  bio: "Robotics and Electrical Engineer specializing in autonomous mobile robots (ROS 2/Nav2), embedded firmware (STM32/CAN), and vision-based manipulation."
  location: "United States"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/eugeniopasos"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/eugeniopasos"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:eugiep@gmail.com"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/eugeniopasos"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/eugeniopasos"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:eugiep@gmail.com"

# Default front matter values
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
      share: true
      related: false
  - scope:
      path: "projects"
      type: "pages"
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
      share: true
      related: false
